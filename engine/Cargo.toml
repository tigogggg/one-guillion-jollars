[package]
name = "ogj_engine"
version = "0.1.0"
edition = "2021"
description = "One Guillion Jollars: the agents' trading engine (portfolio, orders, fills, exits, taxes, strategies)"
license = "MIT"
publish = false

[lib]
name = "ogj_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
numpy = "0.30"
indexmap = "2"
serde_json = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
