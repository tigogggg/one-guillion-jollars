name: Configurar o bot do Discord

on:
  workflow_dispatch:
    inputs:
      registar_comandos:
        description: "Registar os comandos /acao /etf /mercado /posicao /ajuda"
        type: boolean
        default: true
      boas_vindas:
        description: "Publicar a mensagem de boas-vindas (para afixar no canal)"
        type: boolean
        default: true
      criar_canais:
        description: "Criar a categoria 📈 FINANÇAS e os canais do bot"
        type: boolean
        default: false
      diagnostico:
        description: "Mostrar as permissões do bot no servidor"
        type: boolean
        default: false
      canal_testes:
        description: "Criar o canal 🧪-testes (guardado no ramo em que corre)"
        type: boolean
        default: false
      portal:
        description: "Criar o canal 🏟️-portal e afixar a mensagem do portal (banner e botões)"
        type: boolean
        default: false
      canal_estado:
        description: "Criar o canal 🔧-estado (verificação diária do bot)"
        type: boolean
        default: false
      apagar_canais:
        description: "IDs de canais a apagar, separados por vírgulas (nunca do servidor atual)"
        required: false
        default: ""
      espelho:
        description: "ID de um segundo servidor: criar lá os mesmos canais e copiar para lá cada publicação (guardado no ramo em que corre)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Registar comandos
        if: ${{ inputs.registar_comandos }}
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: uv run python scripts/discord_setup.py --register
      - name: Diagnóstico das permissões
        if: ${{ inputs.diagnostico }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run python scripts/discord_setup.py --diagnostico
      - name: Criar os canais
        if: ${{ inputs.criar_canais }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          uv run python scripts/discord_setup.py --canais
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord/channels.json
          git diff --cached --quiet && exit 0
          git commit -m "Discord: canais da categoria FINANÇAS"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Criar o canal de testes
        if: ${{ inputs.canal_testes }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          uv run python scripts/discord_setup.py --canal-testes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord/channels.json
          git diff --cached --quiet && exit 0
          git commit -m "Discord: canal de testes"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
      - name: Canal e mensagem do portal
        if: ${{ inputs.portal }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          uv run python scripts/discord_setup.py --portal
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord/channels.json
          git diff --cached --quiet && exit 0
          git commit -m "Discord: canal do portal"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
      - name: Criar o canal de estado
        if: ${{ inputs.canal_estado }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          uv run python scripts/discord_setup.py --canal-estado
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord/channels.json
          git diff --cached --quiet && exit 0
          git commit -m "Discord: canal de estado"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
      - name: Apagar canais
        if: ${{ inputs.apagar_canais != '' }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APAGAR: ${{ inputs.apagar_canais }}
        run: uv run python scripts/discord_setup.py --apagar-canais "$APAGAR"
      - name: Criar os canais no servidor espelho
        if: ${{ inputs.espelho != '' }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ESPELHO: ${{ inputs.espelho }}
          BRANCH: ${{ github.ref_name }}
        run: |
          uv run python scripts/discord_setup.py --espelho "$ESPELHO"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord/mirror.json
          git diff --cached --quiet && exit 0
          git commit -m "Discord: servidor espelho"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
      - name: Publicar boas-vindas
        if: ${{ inputs.boas_vindas }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run python scripts/discord_setup.py --welcome
