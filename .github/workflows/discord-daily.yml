name: Dicas do dia (Discord)

on:
  schedule:
    # Seg-Sex às 11:37 UTC (manhã em Lisboa, antes da abertura dos EUA),
    # com os dados do fecho anterior.
    - cron: "37 11 * * 1-5"
  workflow_dispatch:
    inputs:
      so_rankings:
        description: "Publicar só os rankings (sem breadth/VCP, não gasta quota FMP)"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Publicar no Discord
        if: ${{ !inputs.so_rankings }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: uv run python scripts/discord_daily.py
      - name: Rankings de ações e ETFs
        if: ${{ !cancelled() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run python scripts/rankings.py
      - name: Guardar a watchlist para os alertas
        if: ${{ !cancelled() && hashFiles('state/watchlist/*.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state/watchlist
          key: watchlist-${{ github.run_id }}
