name: Dicas do dia (Discord)

# Started by the Cloudflare Worker at the time set with /horario (default
# 07:00 Lisbon on weekdays), or by hand.
on:
  workflow_dispatch:
    inputs:
      so_rankings:
        description: "Publicar só os rankings (sem breadth/VCP, não gasta quota FMP)"
        type: boolean
        default: false

permissions:
  contents: read  # least privilege: these jobs never push

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Publicar no Discord
        if: ${{ !inputs.so_rankings }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: uv run python scripts/discord_daily.py
      - name: Rankings de ações e ETFs
        if: ${{ !cancelled() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: uv run python scripts/rankings.py
      - name: Guardar a watchlist para os alertas
        if: ${{ !cancelled() && hashFiles('state/watchlist/*.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state/watchlist
          key: watchlist-${{ github.run_id }}
