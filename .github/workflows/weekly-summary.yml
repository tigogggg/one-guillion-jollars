name: Resumo semanal (Discord)

# Started by the Cloudflare Worker at the time set with /horario (default
# Saturday 10:00 Lisbon), or by hand.
on:
  workflow_dispatch:

permissions:
  contents: read  # least privilege: these jobs never push

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dados dos agentes (repositório privado, só leitura)
        uses: actions/checkout@v4
        with:
          repository: tigogggg/one-guillion-jollars-dados
          ssh-key: ${{ secrets.DADOS_DEPLOY_KEY }}
          persist-credentials: false
          path: agents
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Carregar o histórico de alertas
        uses: actions/cache/restore@v4
        with:
          path: state/history
          key: alert-history-latest
          restore-keys: alert-history-
      - name: Carregar a watchlist (rankings)
        uses: actions/cache/restore@v4
        with:
          path: state/watchlist
          key: watchlist-latest
          restore-keys: watchlist-
      - name: Publicar o resumo semanal
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: uv run python scripts/weekly_summary.py
