name: Notícias (Discord)

# Started by the Cloudflare Worker at the times set with /horario (default
# 12:00, 16:00 and 20:30 Lisbon on weekdays), or by hand. Claude reads the
# headlines with the owner's subscription; FinBERT is the fallback.
on:
  workflow_dispatch:
    inputs:
      republicar:
        description: "Só voltar a publicar as notícias importantes das últimas 36 h"
        type: boolean
        default: false

concurrency:
  group: news
  cancel-in-progress: false

permissions:
  contents: read  # least privilege: nothing is pushed here (the archive goes to the private repo with its deploy key)
  actions: write  # a grave event asks for an extraordinary 18-month view (visao.yml)

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # measured 1.4-4 min
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Dados dos agentes (repositório privado; o arquivo de notícias é guardado lá)
        uses: actions/checkout@v4
        with:
          repository: tigogggg/one-guillion-jollars-dados
          ssh-key: ${{ secrets.DADOS_DEPLOY_KEY }}
          path: agents
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Instalar o Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Carregar a watchlist e o fio do dia
        uses: actions/cache/restore@v4
        with:
          path: state/watchlist
          key: watchlist-latest
          restore-keys: watchlist-
      - name: Carregar as notícias já analisadas
        uses: actions/cache/restore@v4
        with:
          path: state/news
          key: news-latest
          restore-keys: news-
      - name: Republicar as notícias guardadas
        if: ${{ inputs.republicar }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: uv run python scripts/news.py --republicar
      - name: Analisar com o Claude
        id: claude
        if: ${{ !inputs.republicar }}
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}  # the companies' 8-K filings
        run: uv run python scripts/news.py
      - name: Reserva FinBERT (se o Claude falhar)
        if: ${{ steps.claude.outcome == 'failure' }}
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install "transformers>=4.44,<5"
          uv run --no-sync python scripts/news.py --finbert
      - name: Visão extraordinária (choque grave)
        if: ${{ !inputs.republicar && !cancelled() }}
        continue-on-error: true  # never fails the news run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          why=$(uv run python scripts/vision.py --gatilho | sed -n 's/^VISAO_EXTRA=//p')
          if [ -n "$why" ]; then
            gh workflow run visao.yml --ref "$GITHUB_REF_NAME" -f motivo="$why" && echo "Pedi uma visão extraordinária."
          fi
      - name: Negócios declarados no Congresso dos EUA (Câmara, PTR)
        if: ${{ !inputs.republicar && !cancelled() }}
        continue-on-error: true  # never fails the news run
        timeout-minutes: 5
        run: |
          command -v pdftotext >/dev/null || sudo apt-get install -y -qq poppler-utils >/dev/null
          uv run python scripts/congress.py
      - name: Guardar as notícias analisadas
        if: ${{ !cancelled() && hashFiles('state/news/*.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state/news
          key: news-${{ github.run_id }}
      - name: Guardar o arquivo de notícias (repositório privado)
        if: ${{ !cancelled() }}
        working-directory: agents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A arquivo 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Arquivo: notícias $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
