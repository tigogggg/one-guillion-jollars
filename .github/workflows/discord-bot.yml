name: Bot do Discord
run-name: "/${{ inputs.command }} ${{ inputs.arg }}"

# Started by the Cloudflare Worker (discord-bot/worker.js) for /acao, /etf,
# /mercado and /limites; edits the bot's "a pensar…" reply with the answer.
on:
  workflow_dispatch:
    inputs:
      command:
        required: true
        type: string
      arg:
        required: false
        type: string
        default: ""
      application_id:
        required: true
        type: string
      token:
        description: "Token da interação (válido 15 min)"
        required: true
        type: string

permissions:
  actions: read  # /limites: runs and minutes
  checks: read  # /limites: what each run reported
  contents: read

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Instalar o Claude Code (só /limites, para testar o Claude)
        if: ${{ inputs.command == 'limites' }}
        run: npm install -g @anthropic-ai/claude-code
      - name: Responder no Discord
        env:
          GITHUB_TOKEN: ${{ inputs.command == 'limites' && github.token || '' }}
          FMP_API_KEY: ${{ inputs.command == 'limites' && secrets.FMP_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.command == 'limites' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.command == 'limites' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.command == 'limites' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
          COMMAND: ${{ inputs.command }}
          ARG: ${{ inputs.arg }}
          APPLICATION_ID: ${{ inputs.application_id }}
          INTERACTION_TOKEN: ${{ inputs.token }}
        run: uv run python scripts/bot_command.py
