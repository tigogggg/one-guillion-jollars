name: Novidades da plataforma
run-name: "Novidades da plataforma"

# After a push that changes the platform, waits a few minutes (a burst of pushes becomes one post),
# then scripts/updates.py asks Claude to summarise the new commits for members and posts the note in
# 📢-novidades. The bot's own data commits (agents/, data/) do not trigger it.
on:
  push:
    branches: [main]
    paths:
      - "discord-bot/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "!.github/workflows/updates.yml"
  workflow_dispatch:
    inputs:
      desde:
        description: 'Resumir desde esta data (ex.: "2 days ago"); vazio = desde a última nota'
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: updates
  cancel-in-progress: true  # a newer push restarts the wait, so one post covers the whole burst

jobs:
  note:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 5 min wait for more pushes, then about 1 min
    steps:
      - name: Esperar por mais pushes
        if: ${{ github.event_name == 'push' }}
        run: sleep 300
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300
      - name: Dados dos agentes (repositório privado: guarda o uso do Claude)
        uses: actions/checkout@v4
        with:
          repository: tigogggg/one-guillion-jollars-dados
          ssh-key: ${{ secrets.DADOS_DEPLOY_KEY }}
          path: agents
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Instalar o Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Publicar a nota
        env:
          DESDE: ${{ inputs.desde }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$DESDE" ]; then uv run python scripts/updates.py --desde "$DESDE"; else uv run python scripts/updates.py; fi
      - name: Uso do Claude (repositório privado)
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: agents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lab/uso_claude 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -qm "Uso do Claude $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
