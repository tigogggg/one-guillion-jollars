name: Dados de contexto e fundamentos

# Refreshes data/context/ with the slow series (FRED policy uncertainty, high-yield spread and
# Brent, downloaded in small date ranges with retries; the daily Geopolitical Risk index) and
# data/fundamentals/ with the companies' SEC filings (EDGAR, point in time) and data/earnings/ with their
# past earnings release dates (8-K item 2.02), for the backtest's earnings rule. The pre-training and the
# daily runs read these files. Weekly (Sunday, 03:17 UTC), before the Sunday re-training, or by hand.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      so_fundamentos:
        description: "Só os fundamentos da SEC (sem o contexto do FRED, que é lento)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # measured 16-24 min (FRED)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Contexto (FRED, risco geopolítico)
        if: ${{ !inputs.so_fundamentos }}
        continue-on-error: true
        run: uv run python scripts/context.py --atualizar-dados
      - name: Fundamentos (SEC EDGAR)
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}  # the SEC asks for "Name email@example.com"
        run: uv run python scripts/fundamentals.py --atualizar
      - name: Datas de resultados passadas (SEC EDGAR, 8-K item 2.02)
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: uv run python scripts/earnings.py --atualizar
      - name: Guardar
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in data/context data/fundamentals data/earnings; do [ -d "$d" ] && git add "$d"; done
          git diff --cached --quiet && exit 0
          git commit -m "Dados de contexto, fundamentos e resultados: $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
