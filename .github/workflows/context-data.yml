name: Dados de contexto (FRED)

# Refreshes data/context/ with the slow FRED series (policy uncertainty, high-yield
# spread), downloaded in small date ranges with retries, since FRED often times out
# from cloud machines. The pre-training and the daily runs read these files and add
# the latest days when FRED answers. Monthly, before the re-training, or by hand.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Descarregar
        run: uv run python scripts/context.py --atualizar-dados
      - name: Guardar
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/context/
          git diff --cached --quiet && exit 0
          git commit -m "Dados de contexto: $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
