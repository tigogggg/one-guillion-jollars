name: Pré-treino dos agentes
run-name: "Pré-treino ${{ inputs.perfil || 'equilibrado' }}${{ inputs.so_relatorio && ' (só relatório)' || '' }}"

# Walk-forward backtest of every strategy on the last 20 years (the last one is
# the exam), with crash tests and Monte Carlo. Each strategy trains on its own
# machine in parallel; a final job merges the results, applies them (with
# "aplicar") and posts the report. Started by the Worker every Sunday at 06:00
# Lisbon (after the weekly market data), or by hand.
# This repo is public: agents/ is a checkout of the private repo
# one-guillion-jollars-dados (deploy key DADOS_DEPLOY_KEY), and each strategy's
# results travel between jobs encrypted with BACKUP_KEY (artifacts are public too).
on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Aplicar os parâmetros escolhidos aos agentes"
        type: boolean
        default: true
      estrategias:
        description: "Só estas estratégias, separadas por vírgulas (vazio = todas)"
        required: false
        default: ""
      anos:
        description: "Anos de histórico a reproduzir"
        required: false
        default: "20"
      so_relatorio:
        description: "Só voltar a publicar o relatório do último pré-treino (sem treinar)"
        type: boolean
        default: false
      juntar_de:
        description: "Só juntar e aplicar os resultados de uma execução anterior (ID da execução; os artefactos duram 3 dias)"
        required: false
        default: ""
      canal:
        description: "Canal onde voltar a publicar o relatório (com só relatório)"
        type: choice
        options: [agentes, estado, mercado]
        default: agentes
      testes:
        description: "Publicar o relatório no canal 🧪-testes"
        type: boolean
        default: false
      semente:
        description: "Semente dos candidatos aleatórios (vazio = o número da execução: cada execução explora outros parâmetros)"
        required: false
        default: ""
      revisao_claude:
        description: "No fim, o Claude revê os resultados e propõe parâmetros para o próximo treino"
        type: boolean
        default: true
      repetir:
        description: "Execuções extra com novas sementes, dentro de cada máquina (os dados carregam-se uma vez); para quando 2 seguidas não mudam a escolha"
        required: false
        default: "10"
      sem_mudancas:
        description: "(antigo, ignorado)"
        required: false
        default: "0"
      estado_serie:
        description: "(antigo, ignorado)"
        required: false
        default: ""
      ensaio:
        description: "Ensaio: treina e junta, mas não guarda, não publica nem encadeia (para testar mudanças num ramo)"
        type: boolean
        default: false
      escala:
        description: "Intensidade da pesquisa só nesta execução (vazio = a do agents/search.json)"
        required: false
        default: ""
      perfil:
        description: "Perfil de investidor para que se treina (cada um tem os seus agentes e o seu relatório)"
        type: choice
        options: [equilibrado, conservador, arrojado]
        default: equilibrado
      seguintes:
        description: "Perfis a treinar a seguir, um depois do outro (auto = conservador e arrojado depois do equilibrado; nenhum = só este)"
        required: false
        default: "auto"
      serie:
        description: "(antigo, ignorado)"
        required: false
        default: ""
      ciclos:
        description: "Voltar a treinar os perfis todos, até N vezes, enquanto alguma escolha mudar (0 = uma volta)"
        required: false
        default: "0"
      mudou:
        description: "(interno) alguma escolha mudou nesta volta"
        required: false
        default: ""

# The profile reaches every job (scripts/pretrain.py reads PRETRAIN_PERFIL); its report is agents/pretrain.json
# (balanced) or agents/pretrain-<profile>.json.
env:
  PRETRAIN_PERFIL: ${{ inputs.perfil || 'equilibrado' }}
  PRETRAIN_REPORT: ${{ (inputs.perfil == '' || inputs.perfil == 'equilibrado') && 'pretrain.json' || format('pretrain-{0}.json', inputs.perfil) }}

permissions:
  contents: read  # results are pushed to the private data repo with its deploy key
  actions: read  # juntar_de: artifacts of an earlier run

# One pre-training at a time, whatever the profile (each builds on the last one's choices and the merges all write
# agents/): the profiles run one after the other (seguintes). A rehearsal saves nothing, so it runs on its own. Only
# the merge job, which writes agents/, waits for the agents' daily run (agents-state): the hours of training no
# longer hold up the daily league or the /agentes commands.
concurrency:
  group: ${{ inputs.ensaio && format('ensaio-{0}', github.run_id) || 'pretrain' }}
  cancel-in-progress: false

jobs:
  report-only:
    if: ${{ inputs.so_relatorio }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dados dos agentes (repositório privado)
        uses: actions/checkout@v4
        with:
          repository: tigogggg/one-guillion-jollars-dados
          ssh-key: ${{ secrets.DADOS_DEPLOY_KEY }}
          persist-credentials: false
          path: agents
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Publicar o relatório
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_TESTES: ${{ inputs.testes && '1' || '' }}
          CANAL: ${{ inputs.canal || 'agentes' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}  # interactive chart (Worker KV)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run python scripts/pretrain.py --republicar --canal "$CANAL"

  plan:
    if: ${{ !inputs.so_relatorio && !inputs.juntar_de }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      strategies: ${{ steps.list.outputs.strategies }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Dia (Lisboa)
        id: dia
        run: echo "day=$(TZ=Europe/Lisbon date +%F)" >> "$GITHUB_OUTPUT"
      # Prices and context are the same all day (complete sessions up to yesterday): a series of runs on the same day
      # downloads them from Yahoo only once.
      - name: Preços e contexto já descarregados hoje
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            precos/
            ctx/
          key: pretrain-data-${{ steps.dia.outputs.day }}-${{ inputs.anos || '20' }}-${{ hashFiles('data/universe/europe.csv', 'data/context/*.csv', 'scripts/context.py', 'scripts/policy.py') }}
      - name: Contexto de mercado (uma vez, igual para todas as estratégias)
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: uv run python scripts/context.py --guardar ctx/context.csv
      - uses: actions/upload-artifact@v4
        with:
          name: contexto
          path: ctx/
          retention-days: 3
      - name: Preços (uma vez, em vez de cada estratégia os pedir ao Yahoo)
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        env:
          PRICE_CACHE_DIR: precos
          ANOS: ${{ inputs.anos || '20' }}
        run: uv run python scripts/pretrain.py --so-precos --anos "$ANOS"
      - uses: actions/upload-artifact@v4
        with:
          name: precos
          path: precos/
          retention-days: 1
          compression-level: 1
      - id: list
        env:
          ESTRATEGIAS: ${{ inputs.estrategias }}
        run: |
          all="indexador guardiao rotador foguetao analista quant monge abutre pendulo cacador sniper campeao pescador deriva kamikaze estratega navegador tematico"
          chosen="${ESTRATEGIAS:-$all}"
          json=$(echo "$chosen indexador" | tr ', ' '\n\n' | sed '/^$/d' | sort -u | jq -R . | jq -sc .)
          echo "strategies=$json" >> "$GITHUB_OUTPUT"

  train:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300  # GitHub stops any job at 360
    strategy:
      fail-fast: false
      matrix:
        strategy: ${{ fromJson(needs.plan.outputs.strategies) }}
    steps:
      - uses: actions/checkout@v4
      - name: Dados dos agentes (repositório privado)
        uses: actions/checkout@v4
        with:
          repository: tigogggg/one-guillion-jollars-dados
          ssh-key: ${{ secrets.DADOS_DEPLOY_KEY }}
          persist-credentials: false
          path: agents
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - uses: actions/download-artifact@v4
        with:
          name: contexto
          path: ctx
      - uses: actions/download-artifact@v4
        with:
          name: precos
          path: precos
      - name: Treinar ${{ matrix.strategy }}
        env:
          STRATEGY: ${{ matrix.strategy }}
          ANOS: ${{ inputs.anos || '20' }}
          SEMENTE: ${{ inputs.semente || github.run_id }}
          PRICE_CACHE_DIR: precos
          PRETRAIN_SCALE: ${{ inputs.escala }}
          REPETIR: ${{ inputs.repetir || '10' }}
        run: uv run python scripts/pretrain.py --estrategias "$STRATEGY" --anos "$ANOS" --contexto ctx/context.csv --saida "out/$STRATEGY.json" --semente "$SEMENTE" --repeticoes "$REPETIR"
      - name: Cifrar os resultados
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          STRATEGY: ${{ matrix.strategy }}
        run: |
          mkdir enc
          tar czf - out | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_KEY -out "enc/$STRATEGY.tgz.enc"
      - uses: actions/upload-artifact@v4
        with:
          name: pretrain-${{ matrix.strategy }}
          path: enc/
          retention-days: 3
          if-no-files-found: error

  merge:
    needs: train
    if: ${{ !cancelled() && !inputs.so_relatorio }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ inputs.ensaio && format('ensaio-merge-{0}', github.run_id) || 'agents-state' }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write  # juntar_de reads artifacts; repetir dispatches the next run
    steps:
      - uses: actions/checkout@v4
      - name: Dados dos agentes (repositório privado)
        uses: actions/checkout@v4
        with:
          repository: tigogggg/one-guillion-jollars-dados
          ssh-key: ${{ secrets.DADOS_DEPLOY_KEY }}
          path: agents
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.juntar_de }}
        with:
          pattern: pretrain-*
          path: out
      - uses: actions/download-artifact@v4
        if: ${{ inputs.juntar_de }}
        with:
          pattern: pretrain-*
          path: out
          run-id: ${{ inputs.juntar_de }}
          github-token: ${{ github.token }}
      - name: Decifrar os resultados
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: |
          shopt -s nullglob
          for f in out/*/*.tgz.enc; do
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_KEY -in "$f" | tar xzf - -C "$(dirname "$f")" --strip-components=1
            rm "$f"
          done
      - name: Parâmetros escolhidos antes desta execução
        run: jq -c '.strategies | map_values(.chosen)' "agents/$PRETRAIN_REPORT" > "$RUNNER_TEMP/antes.json" || echo '{}' > "$RUNNER_TEMP/antes.json"
      - name: Juntar, aplicar e publicar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPLY: ${{ inputs.aplicar && '--apply' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}  # interactive chart (Worker KV)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENSAIO: ${{ inputs.ensaio }}
        run: |
          if [ "$ENSAIO" = true ]; then  # no post; the report would print the results in this public log
            uv run python scripts/pretrain.py --juntar out $APPLY --dry-run > /dev/null 2> "$RUNNER_TEMP/erros" \
              || { grep -E "Error|Traceback|File " "$RUNNER_TEMP/erros" | tail -8; exit 1; }
            echo "Ensaio: os resultados juntaram-se sem erros (nada foi guardado nem publicado)."
          else
            uv run python scripts/pretrain.py --juntar out $APPLY
          fi
      - name: Guardar os resultados e os parâmetros
        if: ${{ !cancelled() && !inputs.ensaio }}  # also when posting the report failed
        working-directory: agents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Agentes: pré-treino $(date -u +%F)"
          # the intraday rounds push the agents' state every 10 minutes: retry on a race
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null; sleep 10; done
          exit 1
      - name: Instalar o Claude Code
        if: ${{ success() && inputs.revisao_claude != false && !inputs.ensaio && (inputs.perfil == '' || inputs.perfil == 'equilibrado') }}
        run: npm install -g @anthropic-ai/claude-code
      - name: Revisão do Claude (propostas para o próximo treino)
        if: ${{ success() && inputs.revisao_claude != false && !inputs.ensaio && (inputs.perfil == '' || inputs.perfil == 'equilibrado') }}
        continue-on-error: true  # the training is already saved; a failed review only skips the proposals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          git -C agents pull --rebase origin main
          uv run python scripts/agent_review.py
          cd agents
          git add claude_review.json
          git add -A lab/uso_claude 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Agentes: revisão do Claude $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null; sleep 10; done
          exit 1
      # A series of runs (repetir, or a run another run of the series dispatched): dispatch the next one, or, when
      # the series ends (converged, no runs left, or this one failed), say so in 🤖-agentes.
      - name: Encadear a próxima execução ou avisar no fim
        if: ${{ !cancelled() && !inputs.ensaio }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPETIR: ${{ inputs.repetir || '10' }}
          SEGUINTES: ${{ inputs.seguintes }}
          CICLOS: ${{ inputs.ciclos || '0' }}
          MUDOU: ${{ inputs.mudou }}
          ACTOR: ${{ github.actor }}
          ESTADO: ${{ job.status }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          avisar() {  # $1 = ok|falhou, $2 = why the series ended
            AVISO="$1" MOTIVO="$2" MUDARAM="${changed:-}" uv run python - <<'EOF'
          import os, sys
          sys.path.insert(0, "scripts")
          from discord_post import GREEN, RED, embed, route, send
          ok = os.environ["AVISO"] == "ok"
          perfil = os.environ.get("PRETRAIN_PERFIL", "equilibrado")
          title = (f"✅ Pré-treino {perfil} concluído" if ok else f"⚠️ Pré-treino {perfil} interrompido")
          text = (f"O pré-treino dos agentes terminou: {os.environ['MOTIVO']}. Os parâmetros escolhidos estão guardados e "
                  "aplicados; os agentes usam-nos a partir da próxima sessão. O relatório do pré-treino tem os detalhes."
                  if ok else f"O pré-treino dos agentes parou: {os.environ['MOTIVO']}. Os agentes continuam com os "
                  "parâmetros da última execução que correu bem.")
          fields = [("Estratégias que mudaram na última execução", os.environ["MUDARAM"] or "nenhuma")] if ok else None
          sys.exit(send([embed(title, text, GREEN if ok else RED, fields=fields)], **route("agentes")))
          EOF
          }
          if [ "$SEGUINTES" = auto ]; then
            if [ "$PRETRAIN_PERFIL" = equilibrado ]; then SEGUINTES="conservador,arrojado"; else SEGUINTES=""; fi
          fi
          [ "$SEGUINTES" = nenhum ] && SEGUINTES=""  # an empty input becomes the default (auto) when dispatched by the API
          SEGUINTES=$(echo "$SEGUINTES" | tr -d ' ')
          # a single run by hand, with no profiles after it: nothing to chain or announce
          if [ "$REPETIR" -le 0 ] && [ -z "$SEGUINTES" ] && [ "$ACTOR" != "github-actions[bot]" ]; then exit 0; fi
          # the next profile in the queue starts its own series (same number of runs)
          proximo_perfil() {
            if [ -z "$SEGUINTES" ]; then  # the last profile of a round
              if [ "$CICLOS" -gt 0 ] && [ -n "$MUDOU" ]; then  # something changed: all the profiles again
                gh workflow run pretrain.yml --ref "$GITHUB_REF_NAME" -f perfil=equilibrado -f seguintes=auto \
                  -f repetir="$REPETIR" -f ciclos="$((CICLOS - 1))"
                echo "Pedi outra volta aos perfis (faltam até $((CICLOS - 1)) depois dela)."
                return 0
              fi
              # the choices are settled: the intraday lab trains the reactivity on the new parameters, and the
              # population of teams evolves a few more generations (scripts/teams.py)
              gh workflow run intraday-lab.yml --ref "$GITHUB_REF_NAME" -f modo=reatividade && echo "Pedi o treino da reatividade."
              gh workflow run equipas.yml --ref "$GITHUB_REF_NAME" && echo "Pedi a evolução das equipas."
              gh workflow run juri.yml --ref "$GITHUB_REF_NAME" && echo "Pedi o júri (decide aos domingos)."
              return 0
            fi
            next="${SEGUINTES%%,*}"; rest="${SEGUINTES#"$next"}"; rest="${rest#,}"
            gh workflow run pretrain.yml --ref "$GITHUB_REF_NAME" -f perfil="$next" -f seguintes="${rest:-nenhum}" -f repetir="$REPETIR" \
              -f ciclos="$CICLOS" -f mudou="$MUDOU"
            echo "Pedi o pré-treino do perfil seguinte ($next)."
          }
          if [ "$ESTADO" != success ]; then
            avisar falhou "uma execução não correu bem (ver o Actions)${SEGUINTES:+; os perfis seguintes ($SEGUINTES) não foram treinados}"
            exit 0
          fi
          jq -c '.strategies | map_values(.chosen)' "agents/$PRETRAIN_REPORT" > "$RUNNER_TEMP/depois.json"
          changed=$(jq -rn --slurpfile a "$RUNNER_TEMP/antes.json" --slurpfile b "$RUNNER_TEMP/depois.json" \
            '[$b[0] | to_entries[] | select($a[0][.key] != .value) | .key] | join(", ")')
          echo "Estratégias com parâmetros novos: ${changed:-nenhuma}"
          [ -n "$changed" ] && MUDOU=1
          # the series ran inside each strategy's machine (--repeticoes): on to the next profile
          proximo_perfil
          avisar ok "série feita em cada estratégia até a escolha estabilizar" || true
