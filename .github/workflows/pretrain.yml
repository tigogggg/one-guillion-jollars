name: Pré-treino dos agentes

# Walk-forward backtest of every strategy on the last 20 years (the last one is
# the exam), with crash tests and Monte Carlo. Each strategy trains on its own
# machine in parallel; a final job merges the results, applies them (with
# "aplicar") and posts the report. Started by the Worker on the first weekday
# of each month, or by hand.
on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Aplicar os parâmetros escolhidos aos agentes"
        type: boolean
        default: true
      estrategias:
        description: "Só estas estratégias, separadas por vírgulas (vazio = todas)"
        required: false
        default: ""
      anos:
        description: "Anos de histórico a reproduzir"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: agents-state
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      strategies: ${{ steps.list.outputs.strategies }}
    steps:
      - id: list
        env:
          ESTRATEGIAS: ${{ inputs.estrategias }}
        run: |
          all="indexador guardiao rotador foguetao cacador sniper campeao pescador deriva kamikaze"
          chosen="${ESTRATEGIAS:-$all}"
          json=$(echo "$chosen indexador" | tr ', ' '\n\n' | sed '/^$/d' | sort -u | jq -R . | jq -sc .)
          echo "strategies=$json" >> "$GITHUB_OUTPUT"

  train:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        strategy: ${{ fromJson(needs.plan.outputs.strategies) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Treinar ${{ matrix.strategy }}
        env:
          STRATEGY: ${{ matrix.strategy }}
          ANOS: ${{ inputs.anos || '20' }}
        run: uv run python scripts/pretrain.py --estrategias "$STRATEGY" --anos "$ANOS" --saida "out/$STRATEGY.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pretrain-${{ matrix.strategy }}
          path: out/
          retention-days: 3

  merge:
    needs: train
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - uses: actions/download-artifact@v4
        with:
          pattern: pretrain-*
          path: out
      - name: Juntar, aplicar e publicar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPLY: ${{ inputs.aplicar && '--apply' || '' }}
        run: uv run python scripts/pretrain.py --juntar out $APPLY
      - name: Guardar os resultados e os parâmetros
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/
          git diff --cached --quiet && exit 0
          git commit -m "Agentes: pré-treino $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
