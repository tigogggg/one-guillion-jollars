name: Pré-treino dos agentes

# Walk-forward backtest of every strategy on the last 20 years (the last one is
# the exam), with crash tests and Monte Carlo. Each strategy trains on its own
# machine in parallel; a final job merges the results, applies them (with
# "aplicar") and posts the report. Started by the Worker on the first weekday
# of each month, or by hand.
on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Aplicar os parâmetros escolhidos aos agentes"
        type: boolean
        default: true
      estrategias:
        description: "Só estas estratégias, separadas por vírgulas (vazio = todas)"
        required: false
        default: ""
      anos:
        description: "Anos de histórico a reproduzir"
        required: false
        default: "20"
      so_relatorio:
        description: "Só voltar a publicar o relatório do último pré-treino (sem treinar)"
        type: boolean
        default: false
      juntar_de:
        description: "Só juntar e aplicar os resultados de uma execução anterior (ID da execução; os artefactos duram 3 dias)"
        required: false
        default: ""
      canal:
        description: "Canal onde voltar a publicar o relatório (com só relatório)"
        type: choice
        options: [agentes, estado, mercado]
        default: agentes
      testes:
        description: "Publicar o relatório no canal 🧪-testes"
        type: boolean
        default: false
      semente:
        description: "Semente dos candidatos aleatórios (vazio = o número da execução: cada execução explora outros parâmetros)"
        required: false
        default: ""
      revisao_claude:
        description: "No fim, o Claude revê os resultados e propõe parâmetros para o próximo treino"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read  # juntar_de: artifacts of an earlier run

concurrency:
  group: agents-state
  cancel-in-progress: false

jobs:
  report-only:
    if: ${{ inputs.so_relatorio }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Publicar o relatório
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_TESTES: ${{ inputs.testes && '1' || '' }}
          CANAL: ${{ inputs.canal || 'agentes' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}  # interactive chart (Worker KV)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run python scripts/pretrain.py --republicar --canal "$CANAL"

  plan:
    if: ${{ !inputs.so_relatorio && !inputs.juntar_de }}
    runs-on: ubuntu-latest
    outputs:
      strategies: ${{ steps.list.outputs.strategies }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Contexto de mercado (uma vez, igual para todas as estratégias)
        run: uv run python scripts/context.py --guardar ctx/context.csv
      - uses: actions/upload-artifact@v4
        with:
          name: contexto
          path: ctx/
          retention-days: 3
      - id: list
        env:
          ESTRATEGIAS: ${{ inputs.estrategias }}
        run: |
          all="indexador guardiao rotador foguetao analista quant monge abutre pendulo cacador sniper campeao pescador deriva kamikaze"
          chosen="${ESTRATEGIAS:-$all}"
          json=$(echo "$chosen indexador" | tr ', ' '\n\n' | sed '/^$/d' | sort -u | jq -R . | jq -sc .)
          echo "strategies=$json" >> "$GITHUB_OUTPUT"

  train:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        strategy: ${{ fromJson(needs.plan.outputs.strategies) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - uses: actions/download-artifact@v4
        with:
          name: contexto
          path: ctx
      - name: Treinar ${{ matrix.strategy }}
        env:
          STRATEGY: ${{ matrix.strategy }}
          ANOS: ${{ inputs.anos || '20' }}
          SEMENTE: ${{ inputs.semente || github.run_id }}
        run: uv run python scripts/pretrain.py --estrategias "$STRATEGY" --anos "$ANOS" --contexto ctx/context.csv --saida "out/$STRATEGY.json" --semente "$SEMENTE"
      - uses: actions/upload-artifact@v4
        with:
          name: pretrain-${{ matrix.strategy }}
          path: out/
          retention-days: 3

  merge:
    needs: train
    if: ${{ !cancelled() && !inputs.so_relatorio }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.juntar_de }}
        with:
          pattern: pretrain-*
          path: out
      - uses: actions/download-artifact@v4
        if: ${{ inputs.juntar_de }}
        with:
          pattern: pretrain-*
          path: out
          run-id: ${{ inputs.juntar_de }}
          github-token: ${{ github.token }}
      - name: Juntar, aplicar e publicar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPLY: ${{ inputs.aplicar && '--apply' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}  # interactive chart (Worker KV)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run python scripts/pretrain.py --juntar out $APPLY
      - name: Guardar os resultados e os parâmetros
        if: ${{ !cancelled() }}  # also when posting the report failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/
          git diff --cached --quiet && exit 0
          git commit -m "Agentes: pré-treino $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Instalar o Claude Code
        if: ${{ success() && inputs.revisao_claude != false }}
        run: npm install -g @anthropic-ai/claude-code
      - name: Revisão do Claude (propostas para o próximo treino)
        if: ${{ success() && inputs.revisao_claude != false }}
        continue-on-error: true  # the training is already saved; a failed review only skips the proposals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          git pull --rebase origin main
          uv run python scripts/agent_review.py
          git add agents/claude_review.json
          git diff --cached --quiet && exit 0
          git commit -m "Agentes: revisão do Claude $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
