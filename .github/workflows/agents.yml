name: Agentes (Discord)
run-name: "Agentes: ${{ inputs.mode || 'daily' }} ${{ inputs.args }}"

# Daily: simulated agents trade on the latest data and the league is posted.
# Config: /agentes and /agente from the Discord bot (Cloudflare Worker).
# Portal: only refresh the portal's league page from the current state (no trading, no post).
# The agents' state (agents/) is a checkout of the private repo one-guillion-jollars-dados
# and is committed back there (deploy key DADOS_DEPLOY_KEY); this repo is public.
# Daily runs are started by the Cloudflare Worker at the time set with
# /horario (default 07:30 Lisbon on weekdays, before the European open, with the last full sessions).
# Stops: the intraday round (default 10:30, 15:30, 17:00, 20:30): orders fill at today's opens, stops and
# targets reached so far are executed, at the prices the daily run would use.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [daily, config, portal, stops]
        default: daily
      args:
        description: "config: JSON com acao, nome, estrategia, capital, valor, emoji"
        required: false
        default: "{}"
      application_id:
        required: false
        default: ""
      token:
        description: "Token da interação do Discord (válido 15 min)"
        required: false
        default: ""

permissions:
  contents: read

# The rounds (every 10 minutes) have their own queue: a queue keeps only its newest waiting run, so they must not
# push out a waiting daily league or a /agente command.
concurrency:
  group: agents-${{ inputs.mode == 'stops' && 'rounds' || 'state' }}
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Dados dos agentes (repositório privado)
        uses: actions/checkout@v4
        with:
          repository: tigogggg/one-guillion-jollars-dados
          ssh-key: ${{ secrets.DADOS_DEPLOY_KEY }}
          path: agents
      - name: Arquivo intradiário (ramo arquivo-intradiario do repositório privado; só nas rondas)
        if: ${{ inputs.mode == 'stops' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: tigogggg/one-guillion-jollars-dados
          ref: arquivo-intradiario
          ssh-key: ${{ secrets.DADOS_DEPLOY_KEY }}
          path: arquivo-intradiario
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Carregar a watchlist da manhã (ranking e VCP)
        uses: actions/cache/restore@v4
        with:
          path: state/watchlist
          key: watchlist-latest
          restore-keys: watchlist-
      - name: Carregar os sinais das notícias (Jornalista)
        uses: actions/cache/restore@v4
        with:
          path: state/news
          key: news-latest
          restore-keys: news-
      - name: Dia (Lisboa)
        id: dia
        run: echo "day=$(TZ=Europe/Lisbon date +%F)" >> "$GITHUB_OUTPUT"
      - name: Preços do ano, guardados para as rondas do dia
        if: ${{ inputs.mode == 'stops' }}
        uses: actions/cache@v4
        with:
          path: state/prices
          key: prices-${{ steps.dia.outputs.day }}
      - name: Correr os agentes
        env:
          MODE: ${{ inputs.mode || 'daily' }}
          ARGS: ${{ inputs.args || '{}' }}
          APPLICATION_ID: ${{ inputs.application_id }}
          INTERACTION_TOKEN: ${{ inputs.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}  # interactive chart (Worker KV)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run python scripts/agents.py "$MODE" "$ARGS"
      - name: Arquivo semanal dos fundamentais europeus (segunda-feira)
        if: ${{ (inputs.mode || 'daily') == 'daily' && !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          [ "$(TZ=Europe/Lisbon date +%u)" = "1" ] || exit 0
          uv run python scripts/market_archive.py fundamentais
      - name: Guardar o estado dos agentes
        if: ${{ !cancelled() }}
        env:
          MODE: ${{ inputs.mode || 'daily' }}
        working-directory: agents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Agentes: $MODE $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
      - name: Guardar o arquivo intradiário
        if: ${{ !cancelled() && inputs.mode == 'stops' && hashFiles('arquivo-intradiario/**/*.csv.gz') != '' }}
        continue-on-error: true  # the archive never fails the round (nor its price cache)
        working-directory: arquivo-intradiario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Ronda $(TZ=Europe/Lisbon date '+%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin arquivo-intradiario || { sleep 5; continue; }
            git push origin HEAD:arquivo-intradiario && exit 0
            sleep 5
          done
          exit 1
