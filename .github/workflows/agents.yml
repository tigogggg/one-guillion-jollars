name: Agentes (Discord)
run-name: "Agentes: ${{ inputs.mode || 'daily' }} ${{ inputs.args }}"

# Daily: simulated agents trade on the latest data and the league is posted.
# Config: /agentes and /agente from the Discord bot (Cloudflare Worker).
# The agents' state (agents/) is committed back to the repository.
# Daily runs are started by the Cloudflare Worker at the time set with
# /horario (default 12:15 Lisbon on weekdays).
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [daily, config]
        default: daily
      args:
        description: "config: JSON com acao, nome, estrategia, capital, valor, emoji"
        required: false
        default: "{}"
      application_id:
        required: false
        default: ""
      token:
        description: "Token da interação do Discord (válido 15 min)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: agents-state
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Carregar a watchlist da manhã (ranking e VCP)
        uses: actions/cache/restore@v4
        with:
          path: state/watchlist
          key: watchlist-latest
          restore-keys: watchlist-
      - name: Carregar os sinais das notícias (Jornalista)
        uses: actions/cache/restore@v4
        with:
          path: state/news
          key: news-latest
          restore-keys: news-
      - name: Correr os agentes
        env:
          MODE: ${{ inputs.mode || 'daily' }}
          ARGS: ${{ inputs.args || '{}' }}
          APPLICATION_ID: ${{ inputs.application_id }}
          INTERACTION_TOKEN: ${{ inputs.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: uv run python scripts/agents.py "$MODE" "$ARGS"
      - name: Guardar o estado dos agentes
        if: ${{ !cancelled() }}
        env:
          MODE: ${{ inputs.mode || 'daily' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/
          git diff --cached --quiet && exit 0
          git commit -m "Agentes: $MODE $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
