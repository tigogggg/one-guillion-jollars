name: Laboratório intradiário (Alpaca)

# Is reacting during the day worth it? The agents' stock strategies replayed over the last years on US stocks with
# Alpaca's 30-minute bars.
# - comparar: decisions every 30 minutes (the reactive rounds) against once a day (the pre-training's engine), same
#   parameters and prices.
# - reatividade: trains how much each agent buys during the session (agents.INTRADAY_DEFAULTS), every strategy and
#   profile on its own machine, and applies the choice. Dispatched by pretrain.yml when the last profile's series
#   ends (so on Sundays too), or by hand.
# - barras: only the download.
# Two jobs, each with its own time limit: the download (hours the first time; the bars stay in the Actions cache even
# when it stops at its limit, so the next run carries on) and the lab itself, which saves after each strategy.
# This repo is public: the results go to the private repo one-guillion-jollars-dados (agents/lab/, deploy key
# DADOS_DEPLOY_KEY) and to Discord; the log only shows progress.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "O que fazer"
        type: choice
        options: [comparar, reatividade, barras]
        default: comparar
      anos:
        description: "Anos a reproduzir (o Alpaca tem dados desde 2016)"
        required: false
        default: "8"
      estrategias:
        description: "Só estas estratégias, separadas por vírgulas (vazio = todas as de ações)"
        required: false
        default: ""
      testes:
        description: "Publicar o relatório no canal 🧪-testes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: intraday-lab
  cancel-in-progress: false

jobs:
  bars:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write  # the durable copy of the bars (release alpaca-barras)
    outputs:
      complete: ${{ steps.fetch.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Receita (repositório privado, só leitura)
        uses: actions/checkout@v4
        with:
          repository: tigogggg/one-guillion-jollars-dados
          ssh-key: ${{ secrets.DADOS_DEPLOY_KEY }}
          persist-credentials: false
          path: agents
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Barras já descarregadas
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: out/lab/bars
          key: alpaca-bars-${{ github.run_id }}
          restore-keys: alpaca-bars-
      # The Actions cache drops what is not used for 7 days: then the bars come back from their durable copy.
      - name: Sem cache, repor a cópia duradoura
        if: ${{ steps.restore.outputs.cache-matched-key == '' }}
        continue-on-error: true
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download alpaca-barras -p 'barras.tar.enc.*' -D "$RUNNER_TEMP/copia"
          mkdir -p out/lab
          cat "$RUNNER_TEMP"/copia/barras.tar.enc.* | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_KEY | tar x -C out/lab
          rm -r "$RUNNER_TEMP/copia"
          echo "Barras repostas: $(ls out/lab/bars | wc -l) ficheiros"
      - name: Descarregar as barras de 30 minutos que faltam
        id: fetch
        timeout-minutes: 300
        continue-on-error: true
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: uv run python scripts/intraday_lab.py --anos "${{ inputs.anos || '8' }}" --so-barras
      # Durable copy (encrypted: the repo is public) whenever a finished year or month was added. Release assets do
      # not count in the repo's size; the current month is not worth a new copy each day.
      - name: Cópia duradoura das barras
        if: ${{ steps.fetch.outcome == 'success' }}
        continue-on-error: true
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$BACKUP_KEY" ] || { echo "Sem BACKUP_KEY: sem cópia."; exit 0; }
          fechados=$(cd out/lab/bars && ls | grep -v -- '-[0-9]\{4\}-[0-9][0-9]-[0-9][0-9]\.pkl$' | grep '\.pkl$' | sort | sha256sum | cut -c1-16)
          [ "$(cat out/lab/bars/.copia 2>/dev/null)" = "$fechados" ] && { echo "Cópia em dia."; exit 0; }
          mkdir -p "$RUNNER_TEMP/copia"  # in parts below GitHub's 2 GB per file
          tar cf - -C out/lab bars | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_KEY \
            | split -b 1900m -d - "$RUNNER_TEMP/copia/barras.tar.enc."
          ls -l "$RUNNER_TEMP/copia"
          gh release view alpaca-barras >/dev/null 2>&1 || gh release create alpaca-barras --latest=false --title "Barras Alpaca (cifradas)" \
            --notes "Barras de 30 minutos das ações dos EUA para o laboratório intradiário, cifradas com BACKUP_KEY. Repostas sozinhas quando a cache do Actions expira."
          for old in $(gh release view alpaca-barras --json assets -q '.assets[].name'); do  # parts of the last copy
            [ -e "$RUNNER_TEMP/copia/$old" ] || gh release delete-asset alpaca-barras "$old" -y
          done
          gh release upload alpaca-barras "$RUNNER_TEMP"/copia/barras.tar.enc.* --clobber
          echo "$fechados" > out/lab/bars/.copia
      - name: Guardar as barras (também as de uma descarga a meio)
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: out/lab/bars
          key: alpaca-bars-${{ github.run_id }}
      - name: Descarga incompleta
        if: ${{ steps.fetch.outcome != 'success' }}
        run: |
          echo "::warning title=Alpaca::A descarga não terminou; o que já veio fica na cache. Voltar a correr o laboratório continua daí."
          exit 1

  lab:
    needs: bars
    if: ${{ inputs.modo == 'comparar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Dados dos agentes (repositório privado)
        uses: actions/checkout@v4
        with:
          repository: tigogggg/one-guillion-jollars-dados
          ssh-key: ${{ secrets.DADOS_DEPLOY_KEY }}
          path: agents
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Barras de 30 minutos
        uses: actions/cache/restore@v4
        with:
          path: out/lab/bars
          key: alpaca-bars-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Correr o laboratório
        timeout-minutes: 320
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_TESTES: ${{ inputs.testes && '1' || '' }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: uv run python scripts/intraday_lab.py --anos "${{ inputs.anos || '8' }}" --estrategias "${{ inputs.estrategias }}"
      - name: Guardar os resultados (repositório privado), também os de uma execução a meio
        if: ${{ always() }}
        working-directory: agents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lab
          git diff --cached --quiet && exit 0
          git commit -m "Laboratório intradiário $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null; sleep 10; done
          exit 1

  # One machine per profile: every strategy at every reactivity level, scored year by year against the S&P 500.
  # The results travel to the merge job encrypted with BACKUP_KEY (artifacts are public).
  reactivity:
    needs: bars
    if: ${{ inputs.modo == 'reatividade' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        perfil: [equilibrado, conservador, arrojado]
    steps:
      - uses: actions/checkout@v4
      - name: Dados dos agentes (repositório privado)
        uses: actions/checkout@v4
        with:
          repository: tigogggg/one-guillion-jollars-dados
          ssh-key: ${{ secrets.DADOS_DEPLOY_KEY }}
          persist-credentials: false
          path: agents
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Barras de 30 minutos
        uses: actions/cache/restore@v4
        with:
          path: out/lab/bars
          key: alpaca-bars-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Treinar a reatividade (${{ matrix.perfil }})
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PERFIL: ${{ matrix.perfil }}
        run: uv run python scripts/intraday_lab.py --anos "${{ inputs.anos || '8' }}" --reatividade "$PERFIL" --saida "out/reat/reatividade-$PERFIL.json"
      - name: Cifrar os resultados
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          PERFIL: ${{ matrix.perfil }}
        run: |
          mkdir enc
          tar czf - out/reat | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_KEY -out "enc/$PERFIL.tgz.enc"
      - uses: actions/upload-artifact@v4
        with:
          name: reatividade-${{ matrix.perfil }}
          path: enc/
          retention-days: 3
          if-no-files-found: error

  reactivity-merge:
    needs: reactivity
    if: ${{ !cancelled() && inputs.modo == 'reatividade' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: agents-state  # writes the agents' state, like the daily run and the pre-training's merge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Dados dos agentes (repositório privado)
        uses: actions/checkout@v4
        with:
          repository: tigogggg/one-guillion-jollars-dados
          ssh-key: ${{ secrets.DADOS_DEPLOY_KEY }}
          path: agents
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - uses: actions/download-artifact@v4
        with:
          pattern: reatividade-*
          path: res
      - name: Decifrar os resultados
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: |
          shopt -s nullglob
          for f in res/*/*.tgz.enc; do
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_KEY -in "$f" | tar xzf - -C "$(dirname "$f")"
            rm "$f"
          done
      # The rounds push the agents' state every 10 minutes: on a race the choice is applied again to the latest state.
      - name: Aplicar e guardar no repositório privado
        run: |
          git -C agents config user.name "github-actions[bot]"
          git -C agents config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git -C agents fetch -q origin main && git -C agents reset -q --hard origin/main
            uv run python scripts/intraday_lab.py --aplicar-reatividade res --dry-run
            git -C agents add -A
            git -C agents diff --cached --quiet && exit 0
            git -C agents commit -qm "Agentes: reatividade $(date -u +%F)"
            git -C agents push -q origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
      - name: Publicar no Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_TESTES: ${{ inputs.testes && '1' || '' }}
        run: |
          uv run python - <<'EOF'
          import json, sys
          sys.path.insert(0, "scripts")
          from discord_post import detail_posts, route, send
          if not detail_posts():
              sys.exit(0)  # the lab's result is in the private repo and the portal; 🤖-agentes only hears improvements
          card = json.load(open("out/lab/reatividade-embed.json"))
          sys.exit(send([card], {}, **(route("agentes") or {})))
          EOF
