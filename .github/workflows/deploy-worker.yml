name: Publicar o Worker na Cloudflare

on:
  push:
    branches: [main]
    paths: ["discord-bot/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_TITLE: coutotrading-config
    steps:
      - uses: actions/checkout@v4
      - name: Verificar os secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltam os secrets CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID"; exit 1
          fi
      - name: Encontrar ou criar a KV dos horários
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id=$(curl -fsS -H "$auth" "$api?per_page=100" | jq -r --arg t "$KV_TITLE" '.result[] | select(.title == $t) | .id')
          if [ -z "$id" ]; then
            id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
                 -d "{\"title\": \"$KV_TITLE\"}" "$api" | jq -r '.result.id')
            echo "KV criada: $id"
          fi
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::Não consegui obter a KV"; exit 1; }
          sed -i "s/__KV_ID__/$id/" discord-bot/wrangler.toml
      - name: Publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: discord-bot
          command: deploy
      - name: Segredos do login (Discord e Google), se existirem
        env:
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        working-directory: discord-bot
        run: |
          for n in DISCORD_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            v="${!n}"
            if [ -z "$v" ]; then echo "$n por definir: esse login fica desligado"; continue; fi
            printf '%s' "$v" | npx --yes wrangler@3 secret put "$n" >/dev/null && echo "$n atualizado"
          done
