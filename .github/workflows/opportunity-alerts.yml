name: Alertas de oportunidade (Discord)

# Started by the Cloudflare Worker at the times set with /horario (default
# 15:40, 17:40 and 19:40 Lisbon on weekdays, during the US session), or by hand.
on:
  workflow_dispatch:

concurrency: opportunity-alerts

permissions:
  contents: read  # least privilege: these jobs never push

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dados dos agentes (repositório privado, só leitura)
        uses: actions/checkout@v4
        with:
          repository: tigogggg/one-guillion-jollars-dados
          ssh-key: ${{ secrets.DADOS_DEPLOY_KEY }}
          persist-credentials: false
          path: agents
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Carregar a watchlist da manhã
        uses: actions/cache/restore@v4
        with:
          path: state/watchlist
          key: watchlist-latest
          restore-keys: watchlist-
      - name: Carregar o histórico de alertas
        uses: actions/cache/restore@v4
        with:
          path: state/history
          key: alert-history-latest
          restore-keys: alert-history-
      - id: day
        run: echo "d=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - name: Carregar os alertas já enviados hoje
        uses: actions/cache/restore@v4
        with:
          path: state/alerts
          key: alerts-${{ steps.day.outputs.d }}
          restore-keys: alerts-${{ steps.day.outputs.d }}-
      - name: Verificar rompimentos
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run python scripts/opportunity_alerts.py
      - name: Guardar os alertas enviados
        if: ${{ !cancelled() && hashFiles('state/alerts/*.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state/alerts
          key: alerts-${{ steps.day.outputs.d }}-${{ github.run_id }}
      - name: Guardar o histórico de alertas
        if: ${{ !cancelled() && hashFiles('state/history/*.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state/history
          key: alert-history-${{ github.run_id }}
