# Deployed by .github/workflows/deploy-worker.yml on every change to discord-bot/.
name = "captain-tips-bot"
main = "worker.js"
compatibility_date = "2026-10-01"
# DISCORD_PUBLIC_KEY and GITHUB_REPO are set in the Cloudflare dashboard (and
# GITHUB_TOKEN as a secret); keep them across deploys.
keep_vars = true

[vars]
# Public id of the Discord application (OAuth2 "Client ID"), for "Entrar com o Discord".
DISCORD_CLIENT_ID = "1565828174388924570"

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "CONFIG"
# Filled in by the deploy workflow (namespace "coutotrading-config", created if missing).
id = "__KV_ID__"

# --- optional: D1 database (portfolios with versions, backups, shared price cache) ---
# The deploy workflow finds or creates "ogj" and fills in the id; without D1 permission on the
# Cloudflare token it removes this block and the portfolios stay in KV.
[[d1_databases]]
binding = "DB"
database_name = "ogj"
database_id = "__D1_ID__"
# --- end D1 ---

# --- optional: rate limits per address and minute (removed by the workflow if refused) ---
[[unsafe.bindings]]
name = "RL_AUTH"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "RL_WRITE"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RL_READ"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 300, period = 60 }
# --- end rate limits ---
