<!doctype html>
<!--
  Banner of the pinned 🏟️-portal message. Render to ../portal-banner.png with
  Chromium (1200x480 at 2x), e.g. scripts/render_banner.py. Press Start 2P is
  under the SIL Open Font License.
-->
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Pixel"; src: url("press-start-2p.woff2") format("woff2"); }
:root { --gold:#ffe14d; --neon:#00e5ff; --pink:#ff2e88; --green:#39ff88; }
* { margin:0; box-sizing:border-box; }
html, body { width:1200px; height:480px; overflow:hidden; background:#07041a; }
.stage { position:relative; width:1200px; height:480px; overflow:hidden;
  background: radial-gradient(ellipse at 50% 120%, #ff2e8855 0, transparent 55%),
              radial-gradient(ellipse at 50% -30%, #3b1d9a 0, #0b0626 55%, #07041a 100%); }
/* stars */
.stars { position:absolute; inset:0; background-image:
  radial-gradient(1.5px 1.5px at 80px 60px,#fff9,transparent), radial-gradient(1px 1px at 230px 120px,#fff8,transparent),
  radial-gradient(1.5px 1.5px at 400px 40px,#fffa,transparent), radial-gradient(1px 1px at 610px 95px,#fff7,transparent),
  radial-gradient(1.5px 1.5px at 820px 50px,#fff9,transparent), radial-gradient(1px 1px at 990px 130px,#fff8,transparent),
  radial-gradient(1.5px 1.5px at 1130px 70px,#fffa,transparent), radial-gradient(1px 1px at 520px 150px,#fff6,transparent),
  radial-gradient(1px 1px at 160px 170px,#fff6,transparent), radial-gradient(1px 1px at 1060px 30px,#fff7,transparent); }
/* synthwave floor */
.floor { position:absolute; left:-300px; right:-300px; bottom:-40px; height:230px; transform:perspective(320px) rotateX(58deg); transform-origin:bottom;
  background-image: linear-gradient(#ff2e88aa 2px, transparent 2px), linear-gradient(90deg, #00e5ff88 2px, transparent 2px);
  background-size: 60px 34px; mask-image:linear-gradient(transparent, #000 35%); -webkit-mask-image:linear-gradient(transparent, #000 35%); }
.horizon { position:absolute; left:0; right:0; top:262px; height:2px; background:linear-gradient(90deg,transparent,#ff2e88,#00e5ff,#ff2e88,transparent); box-shadow:0 0 18px #ff2e88; }
.frame { position:absolute; inset:10px; border:4px solid var(--pink); border-radius:16px; box-shadow:0 0 18px #ff2e88aa, inset 0 0 18px #ff2e8866; }
.frame::after { content:""; position:absolute; inset:6px; border:2px solid #00e5ff66; border-radius:11px; }
.title { position:absolute; top:46px; width:100%; text-align:center; font-family:Pixel; }
.title .small { font-size:18px; color:var(--neon); letter-spacing:4px; text-shadow:0 0 10px #00e5ffcc; }
.title .big { margin-top:18px; font-size:62px; color:var(--gold); letter-spacing:4px;
  text-shadow: 0 0 14px #ffe14dcc, 4px 4px 0 #ff2e88, 8px 8px 0 #3b1d9a; }
.title .tag { margin-top:22px; font-size:13px; color:#e8e6ff; letter-spacing:2px; text-shadow:0 0 8px #000; }
.title .tag b { color:var(--green); font-weight:400; }
.acute { position:relative; }
.acute::before { content:"´"; position:absolute; left:3px; top:-5px; }  /* the font's accented capitals are small */
/* race track */
.track { position:absolute; left:40px; right:40px; bottom:40px; height:118px; border-radius:10px; border:3px solid #0d2e19;
  background: repeating-linear-gradient(0deg, transparent 0 37px, rgba(255,255,255,.28) 37px 39px), linear-gradient(#1f6b3a,#16522c);
  box-shadow:0 0 22px #39ff8855, inset 0 0 22px #000a; }
.finish { position:absolute; right:0; top:0; bottom:0; width:26px; background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/13px 13px; border-radius:0 8px 8px 0; }
.runner { position:absolute; width:34px; height:34px; display:grid; place-items:center; font-size:19px; border-radius:50%;
  border:3px solid var(--c); background:radial-gradient(circle at 35% 30%,#fff4,transparent 60%),#0b0820; box-shadow:0 0 10px var(--c);
  font-family:"Noto Color Emoji"; transform:translate(-50%,-50%); }
.runner::before { content:"💨"; position:absolute; right:30px; font-size:14px; opacity:.85; }
.crown { position:absolute; top:-17px; font-size:15px; font-family:"Noto Color Emoji"; }
.press { position:absolute; bottom:172px; right:58px; font-family:Pixel; font-size:12px; color:var(--gold); text-shadow:0 0 8px #ffe14d; }
.coin { position:absolute; bottom:172px; left:58px; font-family:Pixel; font-size:12px; color:var(--neon); text-shadow:0 0 8px #00e5ff; }
.scan { position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); }
</style>
</head>
<body>
<div class="stage">
  <div class="stars"></div>
  <div class="horizon"></div>
  <div class="floor"></div>
  <div class="title">
    <div class="small">★ ONE GUILLION JOLLARS ★</div>
    <div class="big">PORTAL</div>
    <div class="tag">CORRIDA DOS AGENTES · NOT<span class="acute">I</span>CIAS · <b>OPORTUNIDADES</b> · A TUA CARTEIRA</div>
  </div>
  <div class="coin">16 AGENTES EM PISTA</div>
  <div class="press">▶ CARREGA EM ABRIR O PORTAL</div>
  <div class="track" id="track"><div class="finish"></div></div>
  <div class="scan"></div>
  <div class="frame"></div>
</div>
<script>
// [emoji, lane 0-2, position 0-1, neon colour]
const runners = [
  ["🚀", 0, .93, "#ff2e88"], ["🐢", 1, .86, "#00e5ff"], ["⚡", 2, .80, "#ffe14d"], ["🎯", 0, .70, "#39ff88"],
  ["🛡️", 1, .63, "#b388ff"], ["💎", 2, .57, "#4dd0e1"], ["🔄", 0, .48, "#ff9f43"], ["🏆", 1, .42, "#f06292"],
  ["🗞️", 2, .35, "#aed581"], ["🧠", 0, .27, "#64b5f6"], ["🎲", 1, .20, "#e57373"], ["🧭", 2, .13, "#ffd54f"],
];
const track = document.getElementById("track");
const w = 1200 - 80 - 6 - 40;
runners.forEach(([e, lane, x, c], i) => {
  const d = document.createElement("div");
  d.className = "runner"; d.textContent = e; d.style.setProperty("--c", c);
  d.style.left = (24 + w * x) + "px"; d.style.top = (19 + lane * 39) + "px";
  if (i === 0) { const k = document.createElement("span"); k.className = "crown"; k.textContent = "👑"; d.appendChild(k); }
  track.appendChild(d);
});
</script>
</body>
</html>
